<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap");

            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
            }

            h1 {
                font-family: "Libre Baskerville", serif;
                font-weight: 400;
                font-style: normal;
                margin: 2px;
            }

            p {
                font-family: "Inter", sans-serif;
                font-style: normal;
                margin: 2px;
            }

            .outer {
                display: table;
                width: 100%;
                height: 100%;
            }

            .inner {
                display: table-cell;     
                vertical-align: middle;  
                text-align: center;   
            }

            button {
                margin: 12px;
                font-family: "Inter", sans-serif;
                padding: 0.5rem 1rem;
                font-weight: 500;
                border: 2px solid #111827;
                border-radius: 0.375rem;
                background: none;
                color: inherit;
                cursor: pointer;
                font-size: 0.875rem;
            }
        </style>
    </head>
    <body>
        <div class="outer">
            <div class="inner">
                <h1>Winterbreak2</h1>
                <p>By Scam.Net, Penguins184</p>
                <button onclick="document.location = '/download'">Jailbreak</button>
            </div>
        </div>
    </body>
</html>
